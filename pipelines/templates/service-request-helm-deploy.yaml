# Register at account scope as service_request_helm_deploy v1 and mark this version stable.
template:
  name: Service Request Helm Deploy
  identifier: service_request_helm_deploy
  versionLabel: v1
  type: Pipeline
  tags:
    idp_enabled: "true"
    purpose: service_request
    service_type: helm
  spec:
    variables:
      - name: service_identifier
        type: String
        value: <+input>
      - name: environment_identifier
        type: String
        value: <+input>
      - name: git_commit
        type: String
        description: Reviewed full Git commit containing the Helm values file.
        value: <+input>
    stages:
      - stage:
          name: Deploy Helm
          identifier: Deploy
          type: Deployment
          spec:
            deploymentType: Kubernetes
            service:
              serviceRef: <+pipeline.variables.service_identifier>
              serviceInputs:
                serviceDefinition:
                  type: Kubernetes
                  spec:
                    manifests:
                      - manifest:
                          identifier: values
                          type: Values
                          spec:
                            store:
                              type: Github
                              spec:
                                commitId: <+pipeline.variables.git_commit>
            environment:
              environmentRef: <+pipeline.variables.environment_identifier>
              deployToAll: false
              infrastructureDefinitions:
                - identifier: <+pipeline.variables.service_identifier>
            execution:
              steps:
                - step:
                    identifier: Rollout
                    name: Rollout
                    type: K8sRollingDeploy
                    timeout: 10m
                    spec:
                      skipDryRun: false
                      pruningEnabled: false
              rollbackSteps:
                - step:
                    identifier: Rollback
                    name: Rollback
                    type: K8sRollingRollback
                    timeout: 10m
                    spec:
                      pruningEnabled: false
          failureStrategies:
            - onFailure:
                errors: [AllErrors]
                action:
                  type: StageRollback
