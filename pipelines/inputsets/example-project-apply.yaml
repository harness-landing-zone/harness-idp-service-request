---
# Troubleshooting input set (Layer 1 - Platform / IaCM only):
# Applies existing Git configs for example_org/example_project after manual IaCM approval.
inputSet:
  name: Example project apply
  identifier: example_project_apply
  orgIdentifier: harness_platform_accelerator
  projectIdentifier: platform_management
  tags:
    purpose: service_request
  pipeline:
    identifier: Project_Service_Reconcile
    variables:
      - name: organization_identifier
        type: String
        value: example_org
      - name: project_identifier
        type: String
        value: example_project
      - name: tofu_action
        type: String
        value: apply
      - name: require_workspace_approval
        type: String
        value: "true"
