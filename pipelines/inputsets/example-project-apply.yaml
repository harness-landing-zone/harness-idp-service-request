---
# Input set for example_org/example_project: no request, apply. The run still waits
# for the manual IaCM approval before it creates anything.
inputSet:
  name: Example project apply
  identifier: example_project_apply
  orgIdentifier: harness_platform_accelerator
  projectIdentifier: platform_management
  tags:
    purpose: service_request
  pipeline:
    identifier: Project_Service_Bootstrap
    variables:
      - name: organization_identifier
        type: String
        value: example_org
      - name: project_identifier
        type: String
        value: example_project
      - name: tofu_action
        type: String
        value: apply
      - name: require_workspace_approval
        type: String
        value: "true"
      - name: request_service
        type: String
        value: "false"
