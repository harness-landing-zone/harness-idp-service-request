---
# Troubleshooting input set (Layer 2 - Orchestrator without IDP UI):
# Sends the exact Cloud Run payload shape the IDP form produces, resolves connectors,
# opens a pull request, waits for approval, merges, and runs a reconcile plan.
inputSet:
  name: Example project request payments-api (Cloud Run)
  identifier: example_project_request_payments_api
  orgIdentifier: harness_platform_accelerator
  projectIdentifier: idp_orchestrator
  description: Full Cloud Run request test for payments_api in example_org/example_project. Exercises connector resolution, PR creation, approval, merge, and IaCM plan without IDP.
  tags:
    purpose: service_request_test
  pipeline:
    identifier: Service_Request
    variables:
      - name: request_action
        type: String
        value: request
      - name: tofu_action
        type: String
        value: plan
      - name: allow_update
        type: String
        value: "false"
      - name: organization_identifier
        type: String
        value: example_org
      - name: project_identifier
        type: String
        value: example_project
      - name: service_type
        type: String
        value: cloudrun
      - name: service_identifier
        type: String
        value: payments_api
      - name: service_name
        type: String
        value: payments-api
      - name: service_owner
        type: String
        value: group:account/developers
      - name: service_description
        type: String
        value: Payments API on Cloud Run
      - name: service_config
        type: String
        value: '{"git":{"connector":{"identifier":"generic","org":"","project":""},"repository":"payments","path":"deploy/cloud-run/service.yaml"}}'
      - name: service_infrastructure
        type: String
        value: '{"connector":{"identifier":"gcpproject","org":"example_org","project":"example_project"},"environments":[{"environment":"dev","gcp_project":"my-gcp-project-dev","gcp_region":"europe-west2"},{"environment":"staging","gcp_project":"my-gcp-project-staging","gcp_region":"europe-west2"}]}'
